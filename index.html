<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7d6">
<title>음식탐험 수학놀이터 V1</title>
<style>
:root{--ink:#202124;--muted:#6b7280;--paper:#fffdf7;--card:#fff;--line:#e7e2d5;--accent:#ffbf3f;--accent2:#74b9ff;--ok:#4caf50;--bad:#ef5350;--shadow:0 8px 24px rgba(40,30,10,.09)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:linear-gradient(#fffdf8,#f8fbff);min-height:100vh}
button,input{font:inherit} button{border:0;cursor:pointer}
.app{max-width:980px;margin:auto;padding:18px 18px 90px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.brand{font-size:28px;font-weight:900}.small{color:var(--muted);font-size:14px}
.iconbtn{width:52px;height:52px;border:2px solid #444;border-radius:18px;background:#fff;font-size:25px}
.hero{background:linear-gradient(135deg,#fff3bd,#e8f5ff);border:1px solid var(--line);border-radius:30px;padding:26px;box-shadow:var(--shadow)}
.hero h1{font-size:38px;margin:0 0 8px}.hero p{font-size:20px;line-height:1.5;margin:0;color:#4b5563}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.bigbtn{min-height:120px;text-align:left;background:#fff;border:2px solid #eee2bd;border-radius:24px;padding:18px}.bigbtn .emoji{font-size:44px}.bigbtn strong{display:block;font-size:22px;margin-top:8px}.bigbtn span{display:block;color:var(--muted);margin-top:5px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 10px}.section-title h2{margin:0;font-size:25px}
.progress{height:12px;background:#eee;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:0}
.foodgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.food{position:relative;min-height:145px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;text-align:center}.food .pic{height:82px;display:flex;align-items:center;justify-content:center;font-size:54px}.food img{max-width:100%;max-height:82px;border-radius:14px}.lock{filter:grayscale(1);opacity:.35}.tag{display:inline-block;background:#f4f1e8;border-radius:99px;padding:4px 9px;font-size:12px;margin-top:5px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:10}.navin{max-width:980px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{padding:12px 4px;background:transparent;font-size:13px}.nav button b{display:block;font-size:22px}
.screen{display:none}.screen.active{display:block}
.choicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.choice{min-height:100px;border:2px solid #e9e2d0;border-radius:22px;background:#fff;font-size:25px;font-weight:800}.choice:hover{transform:translateY(-1px)}
.objects{display:flex;flex-wrap:wrap;gap:10px;min-height:100px;align-items:center;justify-content:center;padding:18px;background:#fff;border-radius:22px;border:1px dashed #ddd}.obj{font-size:42px;animation:pop .2s ease}.bundle{display:flex;flex-direction:column;align-items:center;background:#fff4b9;border:2px solid #f1c94b;border-radius:18px;padding:8px}.bundle .mini{font-size:21px;line-height:1.05;max-width:120px;text-align:center}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.message{padding:14px 16px;border-radius:18px;margin-top:14px;background:#f4f8ff}.message.ok{background:#eaf8ec}.message.bad{background:#fff0ef}
.action{background:#202124;color:#fff;border-radius:18px;padding:13px 18px;font-weight:800}.secondary{background:#f2efe6;color:#333;border-radius:18px;padding:13px 18px;font-weight:800}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=password]{width:100%;padding:14px 15px;border:2px solid #ddd5c4;border-radius:16px;background:#fff}
label{display:block;font-weight:800;margin:12px 0 7px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.show{display:flex}.sheet{background:#fff;border-radius:28px 28px 0 0;width:min(700px,100%);max-height:92vh;overflow:auto;padding:22px}
canvas{width:100%;height:260px;border:2px dashed #ccc;border-radius:18px;background:#fff;touch-action:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8f6ef;border-radius:18px;padding:15px;text-align:center}.stat b{display:block;font-size:28px}
@media(min-width:720px){.foodgrid{grid-template-columns:repeat(5,1fr)}.choicegrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">🍴 음식탐험 수학놀이터</div><div class="small" id="hello"></div></div><button class="iconbtn" onclick="openParent()">⚙️</button></div>

  <section id="home" class="screen active">
    <div class="hero">
      <h1>오늘은 어떤 음식을<br>발견할까요? 🎁</h1>
      <p>수학을 풀면 새로운 음식이 열리고,<br>사진을 찍거나 직접 그려서 나만의 도감을 만들어요.</p>
    </div>
    <div class="grid">
      <button class="bigbtn" onclick="startExplore()"><div class="emoji">🔎</div><strong>음식 탐험</strong><span>음식을 찾고 수량을 세어봐요</span></button>
      <button class="bigbtn" onclick="startMath()"><div class="emoji">🧠</div><strong>수학 놀이터</strong><span>10 만들기 · 덧셈 · 뺄셈</span></button>
      <button class="bigbtn" onclick="show('collection')"><div class="emoji">📕</div><strong>나의 음식도감</strong><span id="collectionCount"></span></button>
      <button class="bigbtn" onclick="newFoodModal()"><div class="emoji">📸</div><strong>새 음식 발견</strong><span>내 사진·그림으로 직접 등록</span></button>
    </div>
    <div class="section-title"><h2>오늘의 탐험 기록</h2></div>
    <div class="card"><div class="stats"><div class="stat"><b id="stars">0</b>⭐<br>별</div><div class="stat"><b id="solved">0</b>개<br>문제</div><div class="stat"><b id="foods">0</b>개<br>획득</div></div></div>
  </section>

  <section id="explore" class="screen">
    <div class="section-title"><h2>🔎 음식 탐험</h2><button class="secondary" onclick="show('home')">나가기</button></div>
    <div class="card"><h2 id="exploreQ"></h2><div id="exploreObjects" class="objects"></div><div id="exploreChoices" class="choicegrid"></div><div id="exploreMsg"></div></div>
  </section>

  <section id="math" class="screen">
    <div class="section-title"><h2>🧠 수학 놀이터</h2><button class="secondary" onclick="show('home')">나가기</button></div>
    <div class="card">
      <div class="small" id="mathStage"></div><div class="progress" style="margin:8px 0 18px"><i id="mathProgress"></i></div>
      <h1 id="mathQ" style="font-size:36px"></h1>
      <div id="mathVisual" class="objects"></div>
      <div id="mathChoices" class="choicegrid"></div>
      <div id="mathMsg"></div>
    </div>
  </section>

  <section id="collection" class="screen">
    <div class="section-title"><h2>📕 나의 음식도감</h2><button class="secondary" onclick="newFoodModal()">➕ 새 음식</button></div>
    <div class="card"><p>수학으로 얻은 음식과 내가 직접 발견한 음식이 차곡차곡 쌓여요.</p><div id="foodGrid" class="foodgrid"></div></div>
  </section>

  <section id="parent" class="screen">
    <div class="section-title"><h2>👨‍👩‍👧 부모님 모드</h2><button class="secondary" onclick="show('home')">닫기</button></div>
    <div class="card">
      <h2>학습 현황</h2><div class="stats"><div class="stat"><b id="pSolved">0</b>문제</div><div class="stat"><b id="pCorrect">0</b>정답</div><div class="stat"><b id="pAccuracy">0%</b>정확도</div></div>
      <h3>개념별 경험</h3><div id="skills"></div>
      <h3>안전관리</h3><div class="row"><button class="action" onclick="backup()">📦 전체 백업</button><label class="secondary" style="display:inline-block;cursor:pointer">📥 복원<input id="restore" type="file" accept=".json" style="display:none" onchange="restore(event)"></label></div>
      <p class="small">백업에는 음식 정보, 학습 기록, 아이가 등록한 사진/그림이 함께 포함됩니다.</p>
      <hr><h3>아이 이름</h3><div class="row"><input id="childName" type="text" placeholder="이름을 입력하세요"><button class="action" onclick="saveName()">저장</button></div>
    </div>
  </section>
</div>

<div class="nav"><div class="navin">
<button onclick="show('home')"><b>🏠</b>홈</button>
<button onclick="show('explore')"><b>🔎</b>탐험</button>
<button onclick="show('math')"><b>🧠</b>수학</button>
<button onclick="show('collection')"><b>📕</b>도감</button>
</div></div>

<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>

<script>
const foodsBase=[
 {id:'apple',name:'사과',emoji:'🍎'},{id:'strawberry',name:'딸기',emoji:'🍓'},{id:'banana',name:'바나나',emoji:'🍌'},
 {id:'riceball',name:'주먹밥',emoji:'🍙'},{id:'pizza',name:'피자',emoji:'🍕'},{id:'burger',name:'햄버거',emoji:'🍔'},
 {id:'cookie',name:'쿠키',emoji:'🍪'},{id:'cake',name:'케이크',emoji:'🍰'},{id:'icecream',name:'아이스크림',emoji:'🍦'},
 {id:'ramen',name:'라면',emoji:'🍜'},{id:'sushi',name:'초밥',emoji:'🍣'},{id:'dumpling',name:'만두',emoji:'🥟'},
 {id:'tteokbokki',name:'떡볶이',emoji:'🌶️'},{id:'kimbap',name:'김밥',emoji:'🍙'},{id:'grape',name:'포도',emoji:'🍇'}
];
let state=JSON.parse(localStorage.getItem('mathFoodState')||'null')||{
 name:'',stars:0,solved:0,correct:0,unlocked:['apple','strawberry','banana'],custom:[],skills:{count:0,ten:0,add:0,carry:0,sub:0,borrow:0},seen:0
};
function save(){localStorage.setItem('mathFoodState',JSON.stringify(state));updateUI()}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='collection')renderFoods();if(id==='home')updateUI()}
function updateUI(){
 document.getElementById('hello').textContent=state.name?`${state.name}의 수학 음식탐험`: '나만의 음식탐험을 시작해요';
 document.getElementById('stars').textContent=state.stars;document.getElementById('solved').textContent=state.solved;document.getElementById('foods').textContent=state.unlocked.length+state.custom.length;
 document.getElementById('collectionCount').textContent=`${state.unlocked.length+state.custom.length}개의 음식이 모였어요`;
}
function food(id){return foodsBase.find(f=>f.id===id)||state.custom.find(f=>f.id===id)}
function randomFood(){let all=[...foodsBase.filter(f=>!state.unlocked.includes(f.id)),...state.custom];return all[Math.floor(Math.random()*all.length)]||foodsBase[0]}
function rewardFood(){let f=randomFood();if(!f)return; if(!state.unlocked.includes(f.id)&&foodsBase.some(x=>x.id===f.id))state.unlocked.push(f.id);state.stars++; return f}
function startExplore(){
 show('explore');let n=2+Math.floor(Math.random()*6), target=foodsBase[Math.floor(Math.random()*foodsBase.length)];
 document.getElementById('exploreQ').textContent=`${target.name} ${n}개를 찾아보세요!`;
 let arr=[];for(let i=0;i<n;i++)arr.push(target);for(let i=0;i<Math.max(2,n-2);i++){let f=foodsBase[Math.floor(Math.random()*foodsBase.length)];if(f.id!==target.id)arr.push(f)}
 arr.sort(()=>Math.random()-.5);document.getElementById('exploreObjects').innerHTML=arr.map(f=>`<button class="obj" onclick="tapExplore(this,'${f.id}','${target.id}')">${f.emoji}</button>`).join('');
 let choices=[n,Math.max(1,n-1),n+1].sort(()=>Math.random()-.5);
 document.getElementById('exploreChoices').innerHTML=choices.map(c=>`<button class="choice" onclick="answerExplore(${c},${n},'${target.id}')">${c}</button>`).join('');
 document.getElementById('exploreMsg').innerHTML='';
}
let tapped=[];
function tapExplore(el,id,target){if(id!==target){el.style.opacity='.25';return}if(!el.dataset.t){el.dataset.t='1';el.style.transform='scale(1.18)';tapped.push(el)}}
function answerExplore(c,n,target){state.solved++;if(c===n){state.correct++;state.skills.count++;let f=rewardFood();state.seen++;document.getElementById('exploreMsg').innerHTML=`<div class="message ok">🎉 정확해요! ${n}개를 찾았어요.<br><br>🎁 <b>${f.name}</b>을 획득했어요!</div>`;save();setTimeout(startExplore,1300)}else{document.getElementById('exploreMsg').innerHTML=`<div class="message bad">한 번 더 천천히 세어볼까요? 👀</div>`;save()}}
function startMath(){show('math');nextMath()}
function nextMath(){
 let r=Math.random(), q;
 if(state.seen<3 || r<.22){let n=Math.floor(Math.random()*9)+1;q={type:'ten',a:n,b:10-n,ans:10,stage:'10 만들기',text:`${n}개가 있어요. 10개가 되려면 몇 개가 더 필요할까요?`,visual:[...Array(n)].map(()=>`🍎`).join('')}}
 else if(r<.58){let a=Math.floor(Math.random()*9)+1,b=Math.floor(Math.random()*9)+1;q={type:a+b>9?'carry':'add',a,b,ans:a+b,stage:a+b>9?'받아올림 준비':'덧셈',text:`${a} + ${b} = ?`,visual:visualAdd(a,b)}}
 else {let a=Math.floor(Math.random()*8)+5,b=Math.floor(Math.random()*Math.min(8,a-1))+1;q={type:a-b>=10?'sub':'sub',a,b,ans:a-b,stage:'뺄셈',text:`${a} - ${b} = ?`,visual:visualSub(a,b)}}
 window.currentQ=q;document.getElementById('mathStage').textContent=q.stage;document.getElementById('mathQ').textContent=q.text;document.getElementById('mathVisual').innerHTML=q.visual;
 let opts=new Set([q.ans,Math.max(0,q.ans-1),q.ans+1,q.ans+2]);let choices=[...opts].sort(()=>Math.random()-.5);
 document.getElementById('mathChoices').innerHTML=choices.map(c=>`<button class="choice" onclick="answerMath(${c})">${c}</button>`).join('');
 document.getElementById('mathMsg').innerHTML='';document.getElementById('mathProgress').style.width=Math.min(100,(state.solved%10)*10+10)+'%';
}
function visualAdd(a,b){let left='';for(let i=0;i<a;i++)left+='🍎';let right='';for(let i=0;i<b;i++)right+='🍎';let all=a+b;if(all>=10){let mini='';for(let i=0;i<10;i++)mini+='🍎';let rem='';for(let i=0;i<all-10;i++)rem+='🍎';return `<div>${left} ＋ ${right}</div><div style="font-size:18px;margin-top:12px">10개가 모이면 <b>한 묶음</b>이에요</div><div class="row" style="justify-content:center;margin-top:10px"><div class="bundle"><div class="mini">${mini}</div><b>10개 묶음</b></div><div style="font-size:32px">＋</div><div style="font-size:30px">${rem||'없음'}</div></div>`}return `<div>${left} ＋ ${right}</div>`}
function visualSub(a,b){let s='';for(let i=0;i<a;i++)s+=`<span class="obj">${i<b?'🍪':'🍪'}</span>`;return `<div style="font-size:18px;margin-bottom:8px">🍪 ${a}개에서 ${b}개를 빼요</div><div>${s}</div>`}
function answerMath(c){
 let q=window.currentQ;state.solved++;
 if(c===q.ans){state.correct++;state.skills[q.type]++;let f=rewardFood();document.getElementById('mathMsg').innerHTML=`<div class="message ok">🎉 정답이에요!<br><br>🎁 <b>${f.name}</b>을 획득했어요!</div>`;save();setTimeout(nextMath,1500)}
 else{document.getElementById('mathMsg').innerHTML=`<div class="message bad">괜찮아요. 다시 그림을 보면서 생각해봐요. 🙂</div>`;save()}
}
function renderFoods(){
 let unlocked=state.unlocked.map(id=>food(id)).filter(Boolean), locked=foodsBase.filter(f=>!state.unlocked.includes(f.id));
 let custom=state.custom;
 let html=[...unlocked,...custom].map(f=>`<div class="food"><div class="pic">${f.image?`<img src="${f.image}">`:f.emoji}</div><b>${f.name}</b><div class="tag">${custom.includes(f)?'내가 발견':'수학으로 획득'}</div></div>`).join('');
 html+=locked.map(f=>`<div class="food lock"><div class="pic">❓</div><b>새 음식</b><div class="tag">수학으로 발견</div></div>`).join('');
 document.getElementById('foodGrid').innerHTML=html;
}
function newFoodModal(){
 document.getElementById('modal').classList.add('show');
 document.getElementById('sheet').innerHTML=`<h2>📸 새로운 음식 발견</h2>
 <p>아이에게 익숙한 음식이면 직접 사진을 찍거나 그림을 그려서 도감에 넣어보세요.</p>
 <label>음식 이름</label><input id="newName" type="text" placeholder="예: 떡볶이">
 <label>사진 선택 또는 촬영</label><input id="newPhoto" type="file" accept="image/*" capture="environment">
 <label>직접 그리기 (선택)</label><canvas id="draw" width="800" height="520"></canvas>
 <div class="row" style="margin-top:10px"><button class="secondary" onclick="clearCanvas()">지우기</button><button class="action" onclick="saveCustomFood()">도감에 등록</button><button class="secondary" onclick="closeModal()">취소</button></div>`;
 setupCanvas();
}
let ctx,drawing=false;
function setupCanvas(){let c=document.getElementById('draw');ctx=c.getContext('2d');ctx.lineWidth=10;ctx.lineCap='round';ctx.strokeStyle='#222';
 function pos(e){let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}}
 c.onpointerdown=e=>{drawing=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!drawing)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=()=>drawing=false;c.onpointerleave=()=>drawing=false;
}
function clearCanvas(){ctx.clearRect(0,0,800,520)}
function compressImage(file,max=720,quality=.72){return new Promise((res,rej)=>{let img=new Image(),r=new FileReader();r.onload=()=>{img.onload=()=>{let scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',quality))};img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function saveCustomFood(){
 let name=document.getElementById('newName').value.trim();if(!name){alert('음식 이름을 입력해주세요.');return}
 let file=document.getElementById('newPhoto').files[0], image='';
 if(file) image=await compressImage(file);
 else {let blank=document.createElement('canvas');blank.width=400;blank.height=260;let b=blank.getContext('2d');b.fillStyle='#fff7d6';b.fillRect(0,0,400,260);b.drawImage(document.getElementById('draw'),0,0,400,260);image=blank.toDataURL('image/jpeg',.72)}
 let id='custom_'+Date.now();state.custom.push({id,name,image,emoji:'🍽️'});save();closeModal();show('collection')
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openParent(){
 document.getElementById('modal').classList.add('show');document.getElementById('sheet').innerHTML=`<h2>🔐 부모님 모드</h2><p>기본 PIN은 <b>1234</b>입니다. 첫 버전에서 확인용으로 사용하며, 추후 PIN 변경 기능을 강화할 수 있습니다.</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN 4자리"><div class="row" style="margin-top:12px"><button class="action" onclick="checkPin()">들어가기</button><button class="secondary" onclick="closeModal()">취소</button></div>`;
}
function checkPin(){if(document.getElementById('pin').value==='1234'){closeModal();document.getElementById('pSolved').textContent=state.solved;document.getElementById('pCorrect').textContent=state.correct;document.getElementById('pAccuracy').textContent=state.solved?Math.round(state.correct/state.solved*100)+'%':'0%';let labels={count:'수 세기',ten:'10의 개념',add:'덧셈',carry:'받아올림 준비',sub:'뺄셈',borrow:'받아내림'};document.getElementById('skills').innerHTML=Object.entries(state.skills).map(([k,v])=>`<p><b>${labels[k]}</b> — ${v}회 경험</p>`).join('');document.getElementById('childName').value=state.name;show('parent')}else alert('PIN이 맞지 않습니다.')}
function saveName(){state.name=document.getElementById('childName').value.trim();save();alert('저장했습니다.');}
function backup(){
