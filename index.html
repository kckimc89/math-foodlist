function filter(v,btn){document.querySelectorAll(".filter").forEach(x=>x.classList.remove("on"));btn.classList.add("on");let a=v==="all"?fruits:fruits.filter(f=>f.climate.includes(v)||f.type?.includes(v));grid.innerHTML=a.map(f=>`<button class="fruit" onclick="openFruit('${f.id}')"><div class="emoji">${f.emoji}</div><b>${f.name}</b><span>${f.en}</span></button>`).join("")}
function openFruit(id){current=fruits.find(f=>f.id===id);if(!state.seen.includes(id))state.seen.push(id);save();detailBox.innerHTML=`<div class="title"><div class="emoji">${current.emoji}</div><h2>${current.name}</h2><div>${current.en}</div><span class="tag">${current.climate}</span></div><div class="info"><div class="box"><h3>🍽️ 어떤 과일일까?</h3><p>${current.desc}</p></div><div class="box"><h3>🌱 어디에서 시작했을까?</h3><p>${current.origin}</p></div><div class="box"><h3>🌎 주요 생산국</h3><div class="countries">${current.countries.map(c=>`<span class="country">${c}</span>`).join("")}</div></div><div class="box"><h3>🗺️ 세계에서 찾아보기</h3><div class="map">🌎</div><p>다음 단계에서 실제 국가 위치와 연결합니다.</p></div></div><button class="action" onclick="startPlay()">🚜 ${current.name} 농장 탐험하기</button>`;go("detail")}
function startPlay(){state.plays++;save();playEmoji.textContent=current.emoji;playTitle.textContent=current.name+" 농장 탐험";let a=6+Math.floor(Math.random()*3),b=3+Math.floor(Math.random()*4),t=a+b;playArea.innerHTML=`<div class="box"><h3>🧺 수확 바구니</h3><p>${current.name} ${a}개를 담았어요. 농부가 ${b}개를 더 가져왔어요.</p><div class="objects">${Array(t).fill(0).map(()=>`<span class="obj">${current.emoji}</span>`).join("")}</div><p>과일을 직접 세어보고 모두 몇 개인지 골라보세요.</p><div class="choices">${[t,t-1,t+1,t+2].sort(()=>Math.random()-.5).map(n=>`<button class="choice" onclick="check(${n},${t})">${n}개</button>`).join("")}</div><div class="feedback" id="fb"></div></div>`;go("play")}
function check(n,t){if(n===t){if(t>=10)state.ten++;save();fb.textContent=`✨ ${current.name}이(가) 모두 ${t}개가 되었어요!`;playArea.insertAdjacentHTML("beforeend",`<button class="action secondary" onclick="openFruit('${current.id}')">과일도감으로 돌아가기</button>`);}else fb.textContent="💭 과일을 하나씩 천천히 세어볼까요?"}renderStats();filter("all",document.querySelector(".filter"));</script></body></html>
