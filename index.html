box{background:#f7fbf5;border-radius:18px;padding:14px;margin-top:11px} .box h3{margin:0 0 8px} .action{width:100%;background:#476b4d;color:white;border-radius:16px;padding:13px 15px;margin-top:10px;font-weight:800} .secondary{background:#e9f2e8;color:#47614b} .stageCard{width:100%;display:flex;gap:12px;text-align:left;background:#fff;border:2px solid #dce7dc;border-radius:18px;padding:14px;margin:8px 0} .stageCard.available{border-color:#9fc6a2} .stageCard.locked{opacity:.55} .stageNum{min-width:58px;text-align:center;font-weight:900;color:#476b4d} .stageCard small,.stageCard em{display:block;color:#68756c;font-style:normal;margin-top:4px;font-size:13px} .playTop{display:flex;align-items:center;gap:10px} .playEmoji{font-size:55px} .mission{background:#fffdf1;border:2px solid #e5d79f;border-radius:18px;padding:14px;margin-top:12px;font-size:18px;line-height:1.55} .sourceGrid,.stage2Farms{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px} .farm,.stage2Farm{background:#fff;border:2px solid #dce7dc;border-radius:18px;padding:12px;text-align:center} .farm h3,.stage2Farm h3{margin:0 0 8px} .fruitGrid,.stage2Grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px} .fruitSlot,.stage2Fruit{aspect-ratio:1;border-radius:9px;background:#fff3d4;border:1px solid #d8bd78;display:flex;align-items:center;justify-content:center;font-size:32px} .fruitSlot.new{background:#e8f4ff;border-color:#82afd2;cursor:pointer} .fruitSlot.moved,.stage2Fruit.moved{opacity:.18} .count{font-weight:900;margin:7px 0 0} .combined{background:#fffdf4;border:3px solid #d2b85f;border-radius:20px;padding:13px;margin-top:12px} .combined h3{text-align:center;margin:0 0 8px} .tenGrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px} .tenCell{aspect-ratio:1;border-radius:8px;background:#fff3d4;border:1px solid #d8bd78;display:flex;align-items:center;justify-content:center;font-size:32px} .tenBundle{border:3px solid #caa949;border-radius:13px;padding:7px;margin-bottom:7px} .groupL <script>
const fruits=[{"id":"apple","name":"사과","en":"Apple","emoji":"🍎","origin":"중앙아시아 일대","countries":["중국","미국","튀르키예","폴란드","인도"],"climate":"온대","desc":"사과는 여러 품종이 있고 껍질 색도 빨강·초록·노랑 등 다양해요.","math":"따기와 세기"},{"id":"banana","name":"바나나","en":"Banana","emoji":"🍌","origin":"동남아시아 일대","countries":["인도","중국","인도네시아","브라질","필리핀"],"climate":"열대·아열대","desc":"바나나는 따뜻한 지역에서 잘 자라며 한 송이에 여러 개가 함께 달려요.","math":"상자에 묶어 담기"},{"id":"mango","name":"망고","en":"Mango","emoji":"🥭","origin":"남아시아 일대","countries":["인도","중국","인도네시아","태국","멕시코"],"climate":"열대·아열대","desc":"망고는 향이 진하고 달콤한 과일이에요. 품종에 따라 모양과 색이 달라요.","math":"수확하고 10개 묶기"},{"id":"pineapple","name":"파인애플","en":"Pineapple","emoji":"🍍","origin":"남아메리카","countries":["코스타리카","필리핀","브라질","인도네시아","중국"],"climate":"열대","desc":"파인애플은 단단한 껍질과 잎이 있는 독특한 모양의 과일이에요.","math":"수확량 비교"},{"id":"kiwi","name":"키위","en":"Kiwifruit","emoji":"🥝","origin":"중국","countries":["중국","뉴질랜드","이탈리아","그리스","칠레"],"climate":"온대","desc":"키위는 갈색 껍질 안에 초록색 과육과 작은 씨가 많이 들어 있어요.","math":"반으로 나누기"},{"id":"dragonfruit","name":"용과","en":"Dragon fruit","emoji":"🐉","origin":"중앙아메리카 일대","countries":["베트남","중국","인도네시아","태국","멕시코"],"climate":"열대·아열대","desc":"용과는 선인장과 식물의 열매예요. 껍질과 과육의 색이 여러 가지예요.","math":"색깔별 분류"},{"id":"papaya","name":"파파야","en":"Papaya","emoji":"🥭","origin":"열대 아메리카","countries":["인도","도미니카공화국","브라질","멕시코","인도네시아"],"climate":"열대","desc":"파파야는 익으면 부드러운 과육과 주황색 계열의 속살을 볼 수 있어요.","math":"씨 세기·비교"},{"id":"avocado","name":"아보카도","en":"Avocado","emoji":"🥑","origin":"멕시코·중앙아메리카 일대","countries":["멕시코","콜롬비아","도미니카공화국","페루","케냐"],"climate":"열대·아열대","desc":"아보카도는 가운데 큰 씨가 하나 있고 부드러운 과육을 가진 과일이에요.","math":"무게 비교"},{"id":"mangosteen","name":"망고스틴","en":"Mangosteen","emoji":"🟣","origin":"동남아시아","countries":["태국","인도네시아","말레이시아","베트남"],"climate":"열대","desc":"망고스틴은 두꺼운 보라색 껍질 안에 흰 과육이 여러 조각으로 들어 있어요.","math":"조각 나누기"},{"id":"durian","name":"두리안","en":"Durian","emoji":"🟢","origin":"동남아시아","countries":["태국","인도네시아","말레이시아"],"climate":"열대","desc":"두리안은 커다란 가시가 있는 껍질과 매우 강한 향으로 유명해요.","math":"크기·무게 비교"},{"id":"lychee","name":"리치","en":"Lychee","emoji":"🔴","origin":"중국 남부 일대","countries":["중국","인도","베트남","마다가스카르","태국"],"climate":"아열대·열대","desc":"리치는 붉은 껍질 안에 반투명한 과육과 씨가 들어 있어요.","math":"껍질 벗기고 세기"},{"id":"passionfruit","name":"패션프루트","en":"Passion fruit","emoji":"🟣","origin":"남아메리카","countries":["브라질","콜롬비아","페루","에콰도르"],"climate":"열대·아열대","desc":"패션프루트는 속에 많은 씨와 과육이 들어 있고 향이 강해요.","math":"씨와 과육 관찰"},{"id":"guava","name":"구아바","en":"Guava","emoji":"🟢","origin":"열대 아메리카","countries":["인도","중국","태국","멕시코","브라질"],"climate":"열대·아열대","desc":"구아바는 품종에 따라 껍질과 과육의 색이 달라질 수 있어요.","math":"크기별 분류"},{"id":"starfruit","name":"스타프루트","en":"Star fruit","emoji":"⭐","origin":"동남아시아","countries":["인도","말레이시아","인도네시아","필리핀"],"climate":"열대·아열대","desc":"스타프루트를 가로로 자르면 별 모양이 보여요.","math":"모양과 조각 세기"},{"id":"watermelon","name":"수박","en":"Watermelon","emoji":"🍉","origin":"아프리카","countries":["중국","튀르키예","인도","브라질","알제리"],"climate":"따뜻한 기후","desc":"수박은 속에 물이 많고 시원하게 먹는 대표적인 여름 과일이에요.","math":"조각 나누기"},{"id":"grape","name":"포도","en":"Grape","emoji":"🍇","origin":"서아시아·지중해 일대","countries":["중국","이탈리아","스페인","미국","프랑스"],"climate":"온대·지중해성","desc":"포도는 덩굴에 송이로 열리며 색과 맛이 다양한 품종이 있어요.","math":"송이와 낱알 세기"},{"id":"fig","name":"무화과","en":"Fig","emoji":"🟤","origin":"서아시아·지중해 일대","countries":["튀르키예","이집트","알제리","이란","모로코"],"climate":"지중해성·온대","desc":"무화과는 익으면 부드러워지고 속에 작은 씨처럼 보이는 구조가 많이 들어 있어요.","math":"반으로 나누어 비교"},{"id":"pomegranate","name":"석류","en":"Pomegranate","emoji":"🔴","origin":"서아시아·이란 주변","countries":["인도","중국","이란","튀르키예","미국"],"climate":"온대·아열대","desc":"석류를 열면 붉고 투명한 알맹이가 많이 들어 있어요.","math":"알맹이 묶기"},{"id":"peach","name":"복숭아","en":"Peach","emoji":"🍑","origin":"중국","countries":["중국","스페인","이탈리아","그리스","튀르키예"],"climate":"온대","desc":"복숭아는 가운데 단단한 씨가 하나 있고 부드러운 과육을 가진 과일이에요.","math":"씨와 과육 구분"},{"id":"orange","name":"오렌지","en":"Orange","emoji":"🍊","origin":"동남아시아 일대","countries":["브라질","중국","인도","멕시코","이집트"],"climate":"아열대·온대","desc":"오렌지는 감귤류 과일로 속에 여러 조각의 과육이 들어 있어요.","math":"조각 나누기"},{"id":"lemon","name":"레몬","en":"Lemon","emoji":"🍋","origin":"아시아","countries":["인도","멕시코","중국","아르헨티나","브라질"],"climate":"아열대","desc":"레몬은 새콤한 맛과 향이 강해 음식과 음료에 다양하게 사용돼요.","math":"더 많다·적다 비교"},{"id":"cherry","name":"체리","en":"Cherry","emoji":"🍒","origin":"유럽·서아시아 일대","countries":["튀르키예","미국","칠레","우즈베키스탄","이란"],"climate":"온대","desc":"체리는 작고 둥근 과일로 빨강이나 진한 색을 띠는 품종이 많아요.","math":"쌍으로 세기"},{"id":"strawberry","name":"딸기","en":"Strawberry","emoji":"🍓","origin":"유럽·아메리카 계통의 재배 역사","countries":["중국","미국","이집트","튀르키예","멕시코"],"climate":"온대·아열대","desc":"딸기는 붉은 열매처럼 보이며 표면에 작은 씨처럼 보이는 구조가 있어요.","math":"개수와 크기 비교"},{"id":"coconut","name":"코코넛","en":"Coconut","emoji":"🥥","origin":"인도양·태평양 열대 지역으로 추정","countries":["인도네시아","인도","필리핀","스리랑카","브라질"],"climate":"열대","desc":"코코넛은 단단한 껍질 안에 물과 흰 과육이 들어 있는 독특한 열매예요.","math":"껍질과 속 비교"},{"id":"melon","name":"멜론","en":"Melon","emoji":"🍈","origin":"아프리카·서아시아 계통","countries":["중국","인도","튀르키예","이란","스페인"],"climate":"따뜻한 온대·아열대","desc":"멜론은 품종에 따라 껍질과 과육의 색, 모양, 향이 다양해요.","math":"무게 비교"},{"id":"persimmon","name":"감","en":"Persimmon","emoji":"🟠","origin":"동아시아","countries":["중국","한국","일본","브라질","아제르바이잔"],"climate":"온대","desc":"감은 단감과 떫은감 등 여러 종류가 있으며 익는 정도에 따라 맛이 달라요.","math":"익기 전후 비교"},{"id":"pear","name":"배","en":"Pear","emoji":"🍐","origin":"유럽·아시아 여러 지역","countries":["중국","이탈리아","미국","아르헨티나","튀르키예"],"climate":"온대","desc":"배는 아삭하고 즙이 많은 과일로 품종에 따라 모양과 맛이 달라요.","math":"크기 비교"},{"id":"grapefruit","name":"자몽","en":"Grapefruit","emoji":"🍊","origin":"카리브해 지역에서 형성","countries":["중국","베트남","멕시코","미국","남아프리카공화국"],"climate":"아열대","desc":"자몽은 감귤류 과일로 새콤하고 약간 쌉쌀한 맛이 특징이에요.","math":"조각 나누기"}];
const KEY='fruitExplorerV26';
const $=id=>document.getElementById(id);
let current=null, mission=null;
function defaultState(){return {seen:[],stages:{},plays:0}}
function loadState(){try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&typeof s==='object')return {seen:Array.isArray(s.seen)?s.seen:[],stages:s.stages&&typeof s.stages==='object'?s.stages:{},plays:Number(s.plays)||0}}}catch(e){}return defaultState()}
let state=loadState();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}updateProgress()}
function updateProgress(){const n=state.seen.length;$('collectionText').textContent=n+' / '+fruits.length;$('progressBar').style.width=(n/fruits.length*100)+'%'}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}
function card(f){const done=Number(state.stages[f.id]||0)>0;return `<button type="button" class="fruitCard ${done?'discovered':'undiscovered'}" data-fruit="${f.id}"><div class="fruitArt">${done?f.emoji:'❔'}</div><b>${f.name}</b><span>${done?'🌱 '+state.stages[f.id]+'단계 탐험 완료':'🔒 아직 발견하지 않은 과일 · 눌러서 탐험하기'}</span></button>`}
function renderGrid(filter='all'){const list=filter==='all'?fruits:fruits.filter(f=>(f.climate||'').includes(filter)||(filter==='감귤'&&['orange','lemon','grapefruit'].includes(f.id)));$('grid').innerHTML=list.map(card).join('');updateProgress()}
function openFruit(id){current=fruits.find(f=>f.id===id);if(!current)return;const st=Number(state.stages[id]||0);$('detailBox').innerHTML=`<div class="title"><div class="emoji">${current.emoji}</div><h2>${current.name}</h2><div>${current.en}</div><span class="tag">${current.climate}</span><span class="tag">탐험 ${st}/6단계</span></div><div class="box"><h3>🍎 어떤 과일일까?</h3><p>${current.desc}</p></div><div class="box"><h3>🌱 어디에서 시작했을까?</h3><p>${current.origin}</p></div><div class="box"><h3>🌎 주요 생산국</h3><p>${current.countries.join(' · ')}</p></div><button id="startFirst" class="action" type="button">🚜 1단계 탐험 시작</button>${st?'<button id="continueStages" class="action secondary" type="button">📚 탐험 계속하기 → 단계 선택</button>':''}`;show('detail')}
function renderStages(){const done=Number(state.stages[current.id]||0);const data=[['🌱','1단계','과일과 숫자','수 세기 · 10개 묶음 · 더하기 · 돌려주기'],['🌎','2단계','과일이 자라는 세계','두 농장 비교 · 더 많다 · 적다 · 같다 · 차이'],['🔟','3단계','10개의 비밀','준비 중'],['📦','4단계','농장에서 세계로','준비 중'],['⚖️','5단계','비교하고 측정하기','준비 중'],['🧑‍🔬','6단계','세계 과일 연구원','준비 중']];$('stageSelectBox').innerHTML=`<div style="text-align:center;font-size:24px;font-weight:900">📚 ${current.name} 탐험 단계 선택</div><p style="text-align:center;color:#68756c">1·2단계는 바로 탐험할 수 있어요.</p>`+data.map((d,i)=>{const n=i+1,ok=n<=2;return `<button type="button" class="stageCard ${ok?'available':'locked'}" data-stage="${ok?n:''}"><div class="stageNum">${ok?(done>=n?'✓':'▶'):'🔒'}<br>${n}단계</div><div><b>${d[0]} ${d[2]}</b><small>${d[3]}</small><em>${ok?(done>=n?'탐험 완료 · 다시 탐험 가능':'탐험 가능 · 눌러서 시작'):'준비 중'}</em></div></button>`}).join('')}
function startPlay(level){mission=null;if(level===1)begin1();else begin2();show('play')}
function begin1(){const pools=[[8,3],[8,5],[7,4],[9,4],[8,7],[9,6]];const [a,b]=pools[Math.floor(Math.random()*pools.length)];mission={level:1,a,b,total:a+b,moved:0,returned:0,phase:'move'};render1()}
function cells(n){return Array.from({length:n},()=>`<div class="fruitSlot">${current.emoji}</div>`).join('')}
function combined(n){let left=n,h='';while(left>=10){h+=`<div class="tenBundle"><div class="groupLabel">🔟 10개 한 묶음</div><div class="tenGrid">${Array.from({length:10},()=>`<div class="tenCell">${current.emoji}</div>`).join('')}</div></div>`;left-=10}if(left)h+=`<div class="tenBundle"><div class="groupLabel">🍎 낱개 ${left}개</div><div class="tenGrid">${Array.from({length:left},()=>`<div class="tenCell">${current.emoji}</div>`).join('')}</div></div>`;return h}
function render1(){const m=mission;$('playEmoji').textContent=current.emoji;$('playTitle').textContent=current.name+' 1단계 탐험';$('levelTag').textContent='🌱 1단계 · 수 세기와 10의 묶음';$('stage2Area').style.display='none';$('stage1Area').style.display='block';
if(m.phase==='move'){$('mission').innerHTML=`처음 바구니에 <b>${m.a}개</b>가 있어요. 더 가져온 과일 <b>${m.b}개</b>를 하나씩 눌러 함께 모아 보세요.`;$('sourceGrid').innerHTML=`<div class="farm"><h3>🧺 처음 바구니</h3><div class="fruitGrid">${cells(m.a)}</div><div class="count">${m.a}개</div></div><div class="farm"><h3>🚜 더 가져온 과일</h3><div class="fruitGrid">${Array.from({length:m.b},(_,i)=>`<button type="button" class="fruitSlot new ${i<m.moved?'moved':''}" data-move1="${i}">${current.emoji}</button>`).join('')}</div><div class="count">남은 ${m.b-m.moved}개</div></div>`;$('combinedContent').innerHTML=combined(m.a+m.moved);$('equation').textContent='';$('choices').innerHTML='';$('feedback').textContent='';$('sourceGrid').style.display='grid';return}
if(m.phase==='total'){$('mission').innerHTML=`함께 모인 과일은 모두 몇 개일까요? <b>${m.a}개 + ${m.b}개</b>를 생각해 보세요.`;$('sourceGrid').style.display='none';$('combinedContent').innerHTML=combined(m.total);$('equation').textContent=`${m.a} + ${m.b} = ?`;$('choices').innerHTML=[m.total,m.total-1,m.total+1,m.total+2].map(n=>`<button type="button" class="choice" data-total="${n}">${n}개</button>`).join('');$('feedback').textContent='';return}
if(m.phase==='sub'){$('mission').innerHTML=`더 가져왔던 과일 <b>${m.b}개</b>를 하나씩 돌려주세요. 처음 바구니의 과일은 그대로예요.`;$('sourceGrid').style.display='none';$('combinedContent').innerHTML=`<div class="tenBundle"><div class="groupLabel">${m.total-m.returned}개 남음 · 더 가져온 과일을 눌러 돌려주기</div><div class="tenGrid">${Array.from({length:m.total},(_,i)=>{const isNew=i>=m.a,idx=i-m.a,ret=isNew&&idx<m.returned;return `<button type="button" class="tenCell" ${(!isNew||ret)?'disabled':''} ${isNew&&!ret?`data-return1="${idx}"`:''}>${ret?'':current.emoji}</button>`}).join('')}</div></div>`;$('equation').textContent=`${m.total} - ${m.b} = ?`;$('choices').innerHTML='';$('feedback').textContent='';return}
if(m.phase==='subAns'){$('mission').innerHTML=`더 가져왔던 과일 ${m.b}개를 모두 돌려주었어요. 남은 과일은 몇 개일까요?`;$('combinedContent').innerHTML=combined(m.a);$('equation').textContent=`${m.total} - ${m.b} = ?`;$('choices').innerHTML=[m.a,m.a-1,m.a+1].filter(n=>n>0).map(n=>`<button type="button" class="choice" data-sub="${n}">${n}개</button>`).join('');$('feedback').textContent='';return}
$('mission').innerHTML=`🎉 이번 탐험을 모두 마쳤어요! ${m.a}+${m.b}=${m.total}, 그리고 ${m.total}-${m.b}=${m.a}를 확인했어요.`;$('combinedContent').innerHTML=combined(m.a);$('equation').textContent=`${m.total} - ${m.b} = ${m.a}`;$('choices').innerHTML='<button type="button" class="action" id="finishStage1">🚜 탐험 계속하기 → 단계 선택</button>';$('feedback').textContent=''}
function begin2(){const pools=[[6,4],[7,5],[8,3],[9,6],[10,5],[8,8]];const [a,b]=pools[Math.floor(Math.random()*pools.length)];mission={level:2,a,b,moved:0,phase:'move'};render2()}
function mini(n,cls=''){return Array.from({length:n},()=>`<span class="${cls}">${current.emoji}</span>`).join('')}
function render2(){$('playEmoji').textContent=current.emoji;$('playTitle').textContent=current.name+' 2단계 탐험';$('levelTag').textContent='🌎 2단계 · 세계 농장 비교';$('stage1Area').style.display='none';$('stage2Area').style.display='block';const m=mission;
if(m.phase==='move'){$('mission').innerHTML=`첫 번째 농장에 <b>${m.a}개</b>, 두 번째 농장에 <b>${m.b}개</b>가 있어요. 두 번째 농장의 과일을 하나씩 아래 비교 공간으로 옮겨 보세요.`;$('stage2Farms').innerHTML=`<div class="stage2Farm"><h3>🇰🇷 첫 번째 농장</h3><div class="stage2Grid">${Array.from({length:m.a},()=>`<div class="stage2Fruit">${current.emoji}</div>`).join('')}</div><p class="count">${m.a}개</p></div><div class="stage2Farm"><h3>🌎 두 번째 농장</h3><div class="stage2Grid">${Array.from({length:m.b},(_,i)=>`<button type="button" class="stage2Fruit ${i<m.moved?'moved':''}" data-move2="${i}">${current.emoji}</button>`).join('')}</div><p class="count">남은 ${m.b-m.moved}개</p></div>`;$('stage2Compare').innerHTML=`<h3>🔎 두 농장 비교 공간</h3><div class="compareRow"><b>🇰🇷 첫 번째 농장 · ${m.a}개</b><div class="compareMini">${mini(m.a)}</div></div><div class="compareRow"><b>🌎 옮겨 온 과일 · ${m.moved}개</b><div class="compareMini world">${mini(m.moved)}</div></div>`;$('stage2Feedback').textContent='';return}
const equal=m.a===m.b;$('mission').innerHTML=`두 번째 농장의 과일을 모두 옮겼어요. 이제 두 농장을 비교해 볼까요?`;$('stage2Farms').innerHTML=`<div class="stage2Farm"><h3>🇰🇷 첫 번째 농장</h3><div class="stage2Grid">${Array.from({length:m.a},()=>`<div class="stage2Fruit">${current.emoji}</div>`).join('')}</div><p class="count">${m.a}개</p></div><div class="stage2Farm"><h3>🌎 두 번째 농장</h3><div class="stage2Grid">${Array.from({length:m.b},()=>`<div class="stage2Fruit moved">${current.emoji}</div>`).join('')}</div><p class="count">${m.b}개</p></div>`;
if(m.phase==='which'){$('stage2Compare').innerHTML=`<div class="question"><b>어느 농장의 과일이 더 많을까요?</b><div class="choices">${equal?'<button type="button" class="choice" data-which="same">같아요</button>':'<button type="button" class="choice" data-which="first">🇰🇷 첫 번째 농장</button><button type="button" class="choice" data-which="second">🌎 두 번째 농장</button>'}</div></div>`;$('stage2Feedback').textContent='';return}
if(m.phase==='diff'){$('stage2Compare').innerHTML=`<div class="question"><b>두 농장의 과일 수는 몇 개 차이 날까요?</b><div class="choices">${[Math.abs(m.a-m.b),Math.abs(m.a-m.b)+1,Math.max(1,Math.abs(m.a-m.b)-1),Math.abs(m.a-m.b)+2].filter((v,i,a)=>a.indexOf(v)===i).map(n=>`<button type="button" class="choice" data-diff="${n}">${n}개</button>`).join('')}</div></div>`;$('stage2Feedback').textContent='';return}
$('stage2Compare').innerHTML='<div class="question"><b>🎉 잘했어요!</b><p>두 농장을 비교하고 차이도 알아보았어요.</p><button type="button" class="action" id="finishStage2">🚜 탐험 계속하기 → 단계 선택</button></div>';$('stage2Feedback').textContent=''}

document.addEventListener('click',e=>{
const fruit=e.target.closest('[data-fruit]');if(fruit){openFruit(fruit.dataset.fruit);return}
const f=e.target.closest('[data-filter]');if(f){document.querySelectorAll('.filter').forEach(x=>x.classList.remove('on'));f.classList.add('on');renderGrid(f.dataset.filter);return}
if(e.target.id==='homeBtn'||e.target.id==='detailBack'){mission=null;show('home');renderGrid('all');return}
if(e.target.id==='startFirst'){startPlay(1);return}
if(e.target.id==='continueStages'){renderStages();show('stageSelect');return}
const sc=e.target.closest('[data-stage]');if(sc&&sc.dataset.stage){startPlay(Number(sc.dataset.stage));return}
if(e.target.id==='stageBack'||e.target.id==='playBack'){if(current){renderStages();show('stageSelect')}else show('home');return}
if(e.target.dataset.move1!==undefined){const i=Number(e.target.dataset.move1);if(mission&&mission.phase==='move'&&i===mission.moved){mission.moved++;if(mission.moved>=mission.b)mission.phase='total';render1()}return}
if(e.target.dataset.total!==undefined){const n=Number(e.target.dataset.total);if(n===mission.total){mission.phase='sub';mission.returned=0;render1()}else{e.target.classList.add('wrong');$('feedback').textContent='💭 과일을 다시 세어 볼까요?'}return}
if(e.target.dataset.return1!==undefined){const i=Number(e.target.dataset.return1);if(mission&&mission.phase==='sub'&&i===mission.returned){mission.returned++;if(mission.returned>=mission.b)mission.phase='subAns';render1()}return}
if(e.target.dataset.sub!==undefined){const n=Number(e.target.dataset.sub);if(n===mission.a){mission.phase='done';state.stages[current.id]=Math.max(Number(state.stages[current.id]||0),1);state.seen=state.seen.includes(current.id)?state.seen:[...state.seen,current.id];state.plays++;save();render1()}else{e.target.classList.add('wrong');$('feedback').textContent='💭 남은 과일을 다시 세어 볼까요?'}return}
if(e.target.id==='finishStage1'){renderStages();show('stageSelect');return}
if(e.target.dataset.move2!==undefined){const i=Number(e.target.dataset.move2);if(mission&&mission.phase==='move'&&i===mission.moved){mission.moved++;if(mission.moved>=mission.b)mission.phase='which';render2()}return}
if(e.target.dataset.which){const c=mission.a===mission.b?'same':mission.a>mission.b?'first':'second';if(e.target.dataset.which===c){mission.phase='diff';render2()}else{e.target.classList.add('wrong');$('stage2Feedback').textContent='💭 과일 칸을 하나씩 비교해 볼까요?'}return}
if(e.target.dataset.diff!==undefined){const n=Number(e.target.dataset.diff);if(n===Math.abs(mission.a-mission.b)){mission.phase='done';state.stages[current.id]=Math.max(Number(state.stages[current.id]||0),2);state.seen=state.seen.includes(current.id)?state.seen:[...state.seen,current.id];state.plays++;save();render2()}else{e.target.classList.add('wrong');$('stage2Feedback').textContent='💭 두 농장의 수를 다시 세어 볼까요?'}return}
if(e.target.id==='finishStage2'){renderStages();show('stageSelect');return}
});
$('stageBack').addEventListener('click',()=>{if(current){openFruit(current.id)}else show('home')});
$('playBack').addEventListener('click',()=>{if(current){renderStages();show('stageSelect')}else show('home')});
renderGrid('all');
</script></body></html>
