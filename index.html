<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>내 음식마을</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff8ed;color:#3b3028;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;border:0;cursor:pointer}
.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:40px}
header{padding:22px 20px 12px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:30px;margin:0}.sub{color:#7c6b5e;margin-top:5px}
.iconbtn{background:white;border:2px solid #eadcc9;border-radius:16px;padding:10px 13px}
.home{padding:10px 18px}
.hero{background:white;border-radius:28px;padding:24px;margin-bottom:18px;box-shadow:0 5px 20px #d8c7b333}
.hero h2{margin:0 0 8px;font-size:26px}.hero p{margin:0;color:#74665b;line-height:1.6}
.world{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.place{background:white;border-radius:24px;padding:20px;min-height:155px;border:2px solid #f0e2d2;text-align:left}
.place .emoji{font-size:48px}.place b{display:block;font-size:20px;margin-top:8px}.place span{font-size:14px;color:#7c6b5e}
.section{margin:24px 0 10px;font-size:20px}
.collection{display:flex;gap:10px;overflow:auto;padding-bottom:8px}
.food{min-width:112px;background:white;border-radius:20px;padding:12px;text-align:center;border:2px solid #f0e2d2}
.food .pic{font-size:42px}.food b{display:block;margin-top:4px}
.screen{display:none}.screen.active{display:block}
.back{background:none;padding:5px 0;color:#806c5a;margin-bottom:12px}
.card{background:white;border-radius:28px;padding:24px;box-shadow:0 5px 20px #d8c7b333}
.bigfood{text-align:center;font-size:90px}.question{font-size:25px;text-align:center;line-height:1.5;margin:12px 0 22px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{background:#fff4df;border:3px solid #f0d9b7;border-radius:22px;padding:18px;font-size:28px;min-height:72px}.choice:active{transform:scale(.97)}
.feedback{text-align:center;min-height:32px;margin-top:15px;font-weight:700;font-size:18px}
.objects{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px auto;max-width:560px}
.obj{font-size:34px;background:#fff7ea;border-radius:12px;padding:3px 6px}
.trays{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}.tray{min-width:190px;min-height:92px;background:#f7efe4;border:3px dashed #d9c3a8;border-radius:20px;padding:10px;text-align:center}.tray.full{border-style:solid}.tray .mini{font-size:25px}
.actionrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.action{background:#6b4f3b;color:white;border-radius:18px;padding:13px 20px}.secondary{background:#f1e4d3;color:#5b493a}
.note{background:#fff7e8;border-radius:18px;padding:14px;margin-top:18px;color:#705f51;line-height:1.5}
.parent{margin-top:20px}.parent summary{cursor:pointer;font-weight:700}.parentbox{background:#fff;border:2px solid #eadcc9;border-radius:20px;padding:16px;margin-top:10px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{background:#fff7ea;border-radius:15px;padding:12px;text-align:center}.stat b{display:block;font-size:22px}
@media(min-width:700px){.world{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>🍎 내 음식마을</h1><div class="sub">먹고, 만들고, 발견하다 보면 숫자도 자라요</div></div><button class="iconbtn" onclick="go('home')">🏠</button></header>

<main class="home">
<section id="home" class="screen active">
<div class="hero"><h2>오늘은 어디로 가볼까?</h2><p>음식을 고르고 놀다 보면 자연스럽게 세고, 모으고, 나누고, 바꾸는 일이 생겨요.</p></div>
<h3 class="section">🍽️ 음식마을</h3>
<div class="world">
<button class="place" onclick="start('market')"><div class="emoji">🛒</div><b>맛있는 시장</b><span>사고, 담고, 더해요</span></button>
<button class="place" onclick="start('pizza')"><div class="emoji">🍕</div><b>피자 가게</b><span>잘라서 나누고 주문해요</span></button>
<button class="place" onclick="start('bakery')"><div class="emoji">🥐</div><b>빵집</b><span>같이 나누어 담아요</span></button>
<button class="place" onclick="start('kitchen')"><div class="emoji">🍳</div><b>우리 주방</b><span>재료를 모아 요리해요</span></button>
</div>
<h3 class="section">📖 내가 발견한 음식</h3>
<div class="collection" id="collection"></div>
<details class="parent"><summary>부모님 보기</summary><div class="parentbox"><div class="stat"><div><b id="played">0</b>번</div><div><b id="foods">0</b>가지</div><div><b id="ten">0</b>회</div></div><div class="note">아이에게는 수학 문제 대신 음식 이야기와 행동을 보여주고, 부모님 화면에서만 학습 경험을 확인합니다.</div></div></details>
</section>

<section id="activity" class="screen">
<button class="back" onclick="go('home')">← 음식마을로 돌아가기</button>
<div class="card">
<div class="bigfood" id="bigfood">🍎</div>
<div class="question" id="question"></div>
<div id="visual"></div>
<div class="choices" id="choices"></div>
<div class="feedback" id="feedback"></div>
<div class="actionrow" id="actions"></div>
</div>
</section>
</main>
</div>
<script>
const foods=[
 {name:"사과",e:"🍎",desc:"빨갛고 동그란 과일"},
 {name:"딸기",e:"🍓",desc:"작고 달콤한 과일"},
 {name:"바나나",e:"🍌",desc:"노랗고 길쭉한 과일"},
 {name:"피자",e:"🍕",desc:"여러 사람이 함께 먹기 좋은 음식"},
 {name:"쿠키",e:"🍪",desc:"바삭하고 달콤한 간식"},
 {name:"김밥",e:"🍙",desc:"밥과 여러 재료를 돌돌 말아 만든 음식"},
 {name:"떡볶이",e:"🍢",desc:"쫄깃한 떡으로 만든 음식"},
 {name:"빵",e:"🥐",desc:"고소한 냄새가 나는 빵"}
];
let state=JSON.parse(localStorage.getItem("foodMathV1")||'{"played":0,"foods":[],"ten":0}');
let current=null;
function save(){localStorage.setItem("foodMathV1",JSON.stringify(state));render()}
function render(){
 document.getElementById("played").textContent=state.played;
 document.getElementById("foods").textContent=state.foods.length;
 document.getElementById("ten").textContent=state.ten;
 const c=document.getElementById("collection");
 c.innerHTML=(state.foods.length?state.foods:foods.slice(0,4).map(x=>x.name)).map(n=>{let f=foods.find(x=>x.name===n)||foods[0];return `<div class="food"><div class="pic">${f.e}</div><b>${f.name}</b></div>`}).join("");
}
function go(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo(0,0)}
function start(type){
 state.played++; save(); current={type};
 let f=foods[Math.floor(Math.random()*foods.length)];
 if(type==="pizza") pizza(f); else if(type==="bakery") bakery(f); else if(type==="kitchen") kitchen(f); else market(f);
 go("activity");
}
function setBase(f,q){bigfood.textContent=f.e;question.textContent=q;visual.innerHTML="";choices.innerHTML="";feedback.textContent="";actions.innerHTML=""}
function addChoice(txt,fn){let b=document.createElement("button");b.className="choice";b.textContent=txt;b.onclick=fn;choices.appendChild(b)}
function market(f){
 let a=3+Math.floor(Math.random()*5), b=2+Math.floor(Math.random()*4), total=a+b;
 setBase(f,`바구니에 ${a}개 담았어요. ${b}개를 더 담으면 모두 몇 개일까요?`);
 visual.innerHTML=`<div class="objects">${Array(a+b).fill(0).map((_,i)=>`<span class="obj">${f.e}</span>`).join("")}</div><div class="note">먼저 담은 것과 새로 담은 것을 눈으로 살펴보세요.</div>`;
 [total,total-1,total+1,Math.max(1,total-2)].sort(()=>Math.random()-.5).forEach(n=>addChoice(n+"개",()=>answer(n===total,`바구니에 모두 ${total}개가 되었어요!`)));
}
function pizza(f){
 let slices=8, take=3, remain=5;
 setBase({e:"🍕"},`피자를 ${slices}조각으로 나눴어요. ${take}조각을 손님에게 주면 몇 조각이 남을까요?`);
 visual.innerHTML=`<div class="objects">${Array(slices).fill(0).map((_,i)=>`<span class="obj">🍕</span>`).join("")}</div><div class="note">손님에게 줄 조각을 마음속으로 또는 손가락으로 옮겨보세요.</div>`;
 [remain,4,6,7].sort(()=>Math.random()-.5).forEach(n=>addChoice(n+"조각",()=>answer(n===remain,`남은 피자는 ${remain}조각이에요.`)));
}
function bakery(f){
 let n=12; let boxes=Math.floor(n/5), rem=n%5;
 setBase({e:"🥐"},`빵이 12개 있어요. 5개씩 상자에 담아보면 어떻게 될까요?`);
 visual.innerHTML=`<div class="trays"><div class="tray"><div class="mini">${"🥐".repeat(5)}</div><b>한 상자</b></div><div class="tray"><div class="mini">${"🥐".repeat(5)}</div><b>한 상자</b></div><div class="tray"><div class="mini">🥐🥐</div><b>남은 빵</b></div></div><div class="note">같은 수만큼 묶으면 한눈에 보기 쉬워져요.</div>`;
 [2,3,4,5].sort(()=>Math.random()-.5).forEach(x=>addChoice(x+"묶음",()=>answer(x===boxes,`5개씩 묶은 상자가 ${boxes}개이고, 2개가 남았어요.`)));
}
function kitchen(f){
 let a=8,b=5,total=13;
 setBase({e:"🍳"},`재료가 ${a}개 있었는데 ${b}개가 더 왔어요. 10개가 차면 큰 바구니를 열어볼까요?`);
 visual.innerHTML=`<div class="trays"><div class="tray full"><div class="mini">${f.e.repeat(10)}</div><b>가득 찬 바구니 1개</b></div><div class="tray"><div class="mini">${f.e.repeat(3)}</div><b>새 바구니에 3개</b></div></div><div class="note">10개가 모이면 '가득 찬 바구니 1개'로 바뀌고, 남은 것은 새 바구니에 담겨요.</div>`;
 [13,12,14,15].sort(()=>Math.random()-.5).forEach(x=>addChoice(x+"개",()=>answer(x===total,`가득 찬 바구니 10개와 새 바구니 3개, 모두 ${total}개예요!`)));
}
function answer(ok,msg){
 feedback.textContent=ok?"✨ "+msg:"💭 다시 음식들을 직접 세어볼까요?";
 if(ok){state.ten += current.type==="kitchen"?1:0; const f=foods[Math.floor(Math.random()*foods.length)]; if(!state.foods.includes(f.name))state.foods.push(f.name); save(); actions.innerHTML='<button class="action" onclick="start(current.type)">다른 이야기 해보기</button><button class="action secondary" onclick="go(\\'home\\')">마을 구경하기</button>'}
 else actions.innerHTML='<button class="action secondary" onclick="feedback.textContent=\\'천천히 다시 살펴봐요 😊\\'">다시 살펴보기</button>';
}
render();
</script>
</body></html>
